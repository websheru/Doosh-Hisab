name: 🔨 Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # manual trigger from GitHub Actions tab

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by Android build tools) ──────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Node.js 20 ─────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Android SDK ─────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # ── 5. Install Cordova globally ────────────────────────────────────────
      - name: Install Cordova
        run: npm install -g cordova@12

      # ── 6. Install project dependencies ───────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 7. Add Android platform ───────────────────────────────────────────
      - name: Add Android platform
        run: cordova platform add android@13.0.0 || true

      # ── 8. Build debug APK ────────────────────────────────────────────────
      - name: Build Debug APK
        run: cordova build android --debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 9. Upload APK as artifact ──────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mera-shelf-debug-${{ github.run_number }}
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 10. Print APK info ─────────────────────────────────────────────────
      - name: Show APK info
        run: |
          APK=platforms/android/app/build/outputs/apk/debug/app-debug.apk
          echo "✅ Build successful!"
          echo "📦 APK size: $(du -sh $APK | cut -f1)"
          echo "📍 APK path: $APK"

